<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}OpenRFD{% endblock %}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="/" class="site-title">RFD Index</a>
      <div class="nav-actions">
        <input type="search" id="search-input" placeholder="Search RFDs... (Cmd+K)" aria-label="Search">
        <button id="login-btn" class="btn btn-sm" style="display:none;">Sign in with GitHub</button>
        <span id="user-info" style="display:none;"></span>
      </div>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Generated by <a href="https://github.com/openrfd/openrfd">OpenRFD</a></p>
  </footer>
  <div id="search-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <input type="search" id="modal-search-input" placeholder="Search RFDs..." autofocus>
      <div id="search-results"></div>
    </div>
  </div>
  <script src="/rfd.js"></script>
</body>
</html>
